name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android Version Code (integer, e.g. 1)'
        required: true
        default: '1'
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        default: 'High-fidelity audio streaming powered by Monochrome.tf sources.'
      publish_release:
        description: 'Publish as GitHub Release with downloadable APK'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Production Bundle
        run: npm run build

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Determine Version Name & Code
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VER="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(node -p "require('./package.json').version || '1.0.0'")
          fi
          VER="${VER#v}"

          CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$CODE" ]; then
            CODE=$(date +%s)
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Building Monochrome Audio v$VER (Code: $CODE)"

          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug / Direct-Install)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Prepare APK Distribution Artifacts
        run: |
          VER="${{ steps.versioning.outputs.version }}"
          mkdir -p release-output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-output/Monochrome-Audio-v${VER}.apk"
            echo "Successfully prepared release-output/Monochrome-Audio-v${VER}.apk"
          else
            echo "Error: APK not found in expected path"
            find android/app/build/outputs/ -type f -name "*.apk"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monochrome-Audio-v${{ steps.versioning.outputs.version }}-APK
          path: release-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release & Attach APK
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Monochrome Audio ${{ steps.versioning.outputs.tag }}"
          body: |
            ## 🎵 Monochrome Audio Player Release (${{ steps.versioning.outputs.tag }})

            ${{ github.event.inputs.release_notes || 'High-fidelity audio streaming powered by Monochrome.tf.' }}

            ### 📦 Download & Install
            - Download the attached **`Monochrome-Audio-${{ steps.versioning.outputs.tag }}.apk`** below.
            - Transfer or open directly on your Android phone and install.
            - Note: Enable "Install unknown apps" permission for your browser or file manager if prompted.

            ---
            *Built automatically via GitHub Actions.*
          files: release-output/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
